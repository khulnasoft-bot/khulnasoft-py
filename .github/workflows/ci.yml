name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  lint-test-and-build:
    name: lint-test-and-build
    runs-on: ubuntu-latest
    environment: ci
    env:
      BLOB_READ_WRITE_TOKEN: ${{ secrets.BLOB_READ_WRITE_TOKEN }}
      KHULNASOFT_PROJECT_ID: ${{ secrets.KHULNASOFT_PROJECT_ID }}
      KHULNASOFT_TEAM_ID: ${{ secrets.KHULNASOFT_TEAM_ID }}
      KHULNASOFT_TOKEN: ${{ secrets.KHULNASOFT_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Set up virtualenv (Python 3.12)
        run: uv venv --python 3.12

      - name: Install dependencies
        run: uv pip install -e .[dev]

      - name: Lint
        run: |
          # The CI ensures that the code is formatted and complain if not.
          # It's on US to commit already formatted clean code.
          uv run ruff check

      - name: Typecheck
        run: |
          uv run mypy src
          uv run python -c "import khulnasoft, khulnasoft.cache, khulnasoft.headers, khulnasoft.oidc, khulnasoft.sandbox"

      - name: Run tests
        run: uv run pytest -v --capture=tee-sys --ignore=tests/test_examples.py

      - name: Run example tests
        run: uv run pytest -v --capture=tee-sys tests/test_examples.py -n auto

      - run: mkdir coverage
      - name: Test
        run: uv run --no-sync bash scripts/test-cov.sh $PYTEST_OPTIONS
        env:
          COVERAGE_FILE: coverage/.coverage.${{ runner.os }}-py${{ matrix.python-version }}-${{ matrix.deprecated-tests}}
          CONTEXT: ${{ runner.os }}-py${{ matrix.python-version }}-${{ matrix.deprecated-tests}}
          PYTEST_OPTIONS: ${{ (matrix.without-httpx2 == 'true') && '-W ignore::UserWarning' || '' }}

      - name: Build package
        run: uv run python -m build

  test:
    name: test
    runs-on: ubuntu-latest
    environment: ci
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect changed test files
        id: changed-tests
        run: |
          echo "Checking for changed test files..."
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE_SHA="${{ github.event.pull_request.base.sha }}"
          else
            BASE_SHA="${{ github.event.before }}"
          fi
          CHANGED_FILES=$(git diff --name-only "$BASE_SHA"...HEAD -- 'tests/**' 'src/**')
          if echo "$CHANGED_FILES" | grep -q '^tests/'; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Python
        if: steps.changed-tests.outputs.found == 'true'
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version-file: "base/.python-version"

      - name: Setup uv
        if: steps.changed-tests.outputs.found == 'true'
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "latest-known"
          enable-cache: true

      - name: Install dependencies
        if: steps.changed-tests.outputs.found == 'true'
        run: uv pip install -e .[dev]

      - name: Run tests
        if: steps.changed-tests.outputs.found == 'true'
        run: uv run --no-sync bash scripts/test.sh -v --capture=tee-sys --ignore=tests/test_examples.py
