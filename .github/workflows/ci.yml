name: CI

on:
  push:
    branches:
      - main
  pull_request:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint-test-and-build:
    name: lint-test-and-build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: ci
    env:
      UV_PYTHON: "3.12"
      BLOB_READ_WRITE_TOKEN: ${{ secrets.BLOB_READ_WRITE_TOKEN }}
      KHULNASOFT_PROJECT_ID: ${{ secrets.KHULNASOFT_PROJECT_ID }}
      KHULNASOFT_TEAM_ID: ${{ secrets.KHULNASOFT_TEAM_ID }}
      KHULNASOFT_TOKEN: ${{ secrets.KHULNASOFT_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0

      - name: Install dependencies
        run: uv sync --all-packages --frozen --python 3.12

      - name: Lint and typecheck
        run: |
          uv run --frozen poe lint
          uv run --frozen poe typecheck

      - name: Check type-ignore baseline
        run: uv run --frozen poe type-ignores

      - name: Check news fragments
        run: uv run --frozen poe check-news-fragments

      - name: Test with coverage
        run: uv run --frozen poe coverage

      - name: Upload coverage
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: coverage
          path: coverage.xml
          if-no-files-found: error

      - name: Build all packages
        run: uv build --all-packages --no-sources

  test-matrix:
    name: test (Python ${{ matrix.python-version }})
    if: github.event_name == 'schedule' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0

      - name: Install dependencies
        run: uv sync --all-packages --frozen --python ${{ matrix.python-version }}

      - name: Test
        run: uv run --frozen --python ${{ matrix.python-version }} poe test

  examples:
    name: examples
    if: github.event_name == 'schedule' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: ci
    env:
      UV_PYTHON: "3.12"
      BLOB_READ_WRITE_TOKEN: ${{ secrets.BLOB_READ_WRITE_TOKEN }}
      KHULNASOFT_PROJECT_ID: ${{ secrets.KHULNASOFT_PROJECT_ID }}
      KHULNASOFT_TEAM_ID: ${{ secrets.KHULNASOFT_TEAM_ID }}
      KHULNASOFT_TOKEN: ${{ secrets.KHULNASOFT_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0

      - name: Install dependencies
        run: uv sync --all-packages --frozen --python 3.12

      - name: Run examples
        run: uv run --frozen poe test-examples

  audit:
    name: audit
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0

      - name: Install dependencies
        run: uv sync --all-packages --frozen --python 3.12

      - name: Audit dependencies
        run: uv run --frozen pip-audit --skip-editable

      - name: Export SBOM
        run: >-
          uv export --format cyclonedx1.5 --all-packages --no-hashes
          --output-file sbom.json

      - name: Upload SBOM
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: sbom
          path: sbom.json
          if-no-files-found: error
