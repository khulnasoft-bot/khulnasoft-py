name: Publish PyPI

on:
  push:
    branches:
      - main
  pull_request:
    types: [labeled, synchronize, reopened]
  workflow_dispatch:
    inputs:
      dry_run:
        description: Build and verify without uploading to PyPI
        type: boolean
        default: false
      force:
        description: Inspect every publishable package
        type: boolean
        default: false

permissions: {}

concurrency:
  group: publish-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  detect:
    name: Detect release
    if: >-
      github.event_name != 'pull_request' ||
      (github.event.pull_request.base.ref == 'main' &&
      contains(github.event.pull_request.labels.*.name, 'release'))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      packages: ${{ steps.detect.outputs.packages }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0

      - name: Install dependencies
        run: uv sync --all-packages --frozen --python 3.12

      - name: Detect release plan
        id: detect
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BEFORE_SHA: ${{ github.event.before }}
          FORCE: ${{ github.event_name == 'workflow_dispatch' && inputs.force }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            base="$BASE_SHA"
            force=false
          else
            base="$BEFORE_SHA"
            force="$FORCE"
            if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ]; then
              base="HEAD^"
            fi
            if [ "$force" != "true" ]; then
              force=false
            fi
          fi
          if [ "$force" = "true" ]; then
            uv run --frozen python scripts/publish.py detect \
              --base "$base" --output "$RUNNER_TEMP/plan.json" --force
          else
            uv run --frozen python scripts/publish.py detect \
              --base "$base" --output "$RUNNER_TEMP/plan.json"
          fi

      - name: Upload release plan
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: release-plan
          path: ${{ runner.temp }}/plan.json
          if-no-files-found: error
          retention-days: 14

  build:
    name: Build release packages
    needs: detect
    if: needs.detect.outputs.packages != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0

      - name: Install dependencies
        run: uv sync --all-packages --frozen --python 3.12

      - name: Download release plan
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          name: release-plan
          path: ${{ runner.temp }}

      - name: Build and verify packages
        run: >-
          uv run --frozen python scripts/publish.py build
          --plan "$RUNNER_TEMP/plan.json"
          --build-dir "$RUNNER_TEMP/build"

      - name: Upload release packages
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: publish-packages
          path: ${{ runner.temp }}/build
          if-no-files-found: error
          retention-days: 14

  publish-dry-run:
    name: Publish dry run
    needs: [detect, build]
    if: >-
      needs.detect.outputs.packages != '[]' &&
      (github.event_name == 'pull_request' ||
      (github.event_name == 'workflow_dispatch' && inputs.dry_run))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0

      - name: Install dependencies
        run: uv sync --all-packages --frozen --python 3.12

      - name: Download release packages
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          name: publish-packages
          path: ${{ runner.temp }}/build

      - name: Verify publish
        run: >-
          uv run --frozen python scripts/publish.py publish
          --plan "$RUNNER_TEMP/build/plan.json"
          --build-dir "$RUNNER_TEMP/build"
          --dry-run

  publish:
    name: Publish release
    needs: [detect, build]
    if: >-
      needs.detect.outputs.packages != '[]' &&
      (github.event_name == 'push' ||
      (github.event_name == 'workflow_dispatch' && !inputs.dry_run))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      id-token: write
    environment:
      name: pypi
      url: https://pypi.org/
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: false

      - name: Install dependencies
        run: uv sync --all-packages --frozen --python 3.12

      - name: Download release packages
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          name: publish-packages
          path: ${{ runner.temp }}/build

      - name: Publish packages
        id: publish
        run: >-
          uv run --frozen python scripts/publish.py publish
          --plan "$RUNNER_TEMP/build/plan.json"
          --build-dir "$RUNNER_TEMP/build"

      - name: Create tags and GitHub releases
        env:
          GH_TOKEN: ${{ github.token }}
          TAGS: ${{ steps.publish.outputs.tags }}
          RELEASE_BODIES: ${{ steps.publish.outputs.release-bodies }}
        run: |
          if [ -z "$TAGS" ]; then
            echo "No tags to release."
            exit 0
          fi
          while IFS= read -r tag; do
            [ -n "$tag" ] || continue
            body="$RELEASE_BODIES/$tag.md"
            if [ ! -f "$body" ]; then
              echo "Missing release body for $tag" >&2
              exit 1
            fi
            if gh release view "$tag" >/dev/null 2>&1; then
              echo "Release $tag already exists."
              continue
            fi
            gh release create "$tag" --title "$tag" --notes-file "$body"
          done <<< "$TAGS"
