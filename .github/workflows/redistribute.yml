name: Redistribute

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: redistribute-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-redistribute:
    name: test-redistribute
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0

      - name: Install dependencies
        run: uv sync --all-packages --frozen --python 3.12

      - name: Build every package
        run: uv build --all-packages --no-sources

      - name: Verify every wheel installs
        run: uv run --frozen python scripts/verify_dist.py --dist-dir dist

      - name: Rebuild wheels from every sdist
        run: |
          mkdir -p dist/rebuilt
          for sdist in dist/*.tar.gz; do
            uv build --wheel --no-sources --out-dir dist/rebuilt "$sdist"
          done
          built=$(find dist/rebuilt -name '*.whl' | wc -l)
          sources=$(find dist -maxdepth 1 -name '*.tar.gz' | wc -l)
          if [ "$built" -ne "$sources" ]; then
            echo "Rebuilt $built wheels from $sources sdists" >&2
            exit 1
          fi

  # https://github.com/marketplace/actions/alls-green#why
  test-redistribute-alls-green:  # This job does nothing and is only used for the branch protection
    if: always()
    needs:
      - test-redistribute
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Decide whether the needed jobs succeeded or failed
        uses: re-actors/alls-green@b5b5b37504aa4183270bd3d855c52a67f212be35 # v1.3.0
        with:
          jobs: ${{ toJSON(needs) }}
