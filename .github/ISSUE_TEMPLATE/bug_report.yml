name: 🐛 Bug Report
description: Report a bug to help us improve
title: "[BUG]: "
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug! Please fill out the information below.
  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear and concise description of the bug
      placeholder: What happened?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: Steps to reproduce the behavior
      placeholder: |
        1. Go to '...'
        2. Click on '....'
        3. Scroll down to '....'
        4. See error
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: A clear and concise description of what you expected to happen
      placeholder: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
      description: What actually happened
      placeholder: What actually happened?
    validations:
      required: true
  - type: dropdown
    id: version
    attributes:
      label: SDK Version
      description: Which version of the SDK are you using?
      options:
        - Latest
        - Specific version (please specify below)
        - Not sure
    validations:
      required: true
  - type: input
    id: version_number
    attributes:
      label: Specific Version
      description: If you selected "Specific version" above, please specify the version number
      placeholder: e.g., 1.2.3
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      description: What platform are you using?
      options:
        - Node.js
        - Browser
        - Deno
        - Bun
        - Other
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment Details
      description: Additional environment details (OS, runtime version, package manager, etc.)
      placeholder: |
        OS: macOS 14.0
        Node: v20.10.0
        Package Manager: npm 10.2.3
  - type: textarea
    id: logs
    attributes:
      label: Logs / Error Messages
      description: Please paste any relevant logs, error messages, or stack traces
      render: shell
      placeholder: Paste logs here...
  - type: textarea
    id: additional
    attributes:
      label: Additional Context
      description: Add any other context about the problem here (screenshots, related issues, etc.)
      placeholder: Any additional information...
  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      description: Please confirm the following
      options:
        - label: I have searched existing issues to avoid duplicates
          required: true
        - label: I have provided all the requested information
          required: true
