repos:
  - repo: local
    hooks:
      - id: lint
        name: lint
        entry: uv run --frozen poe lint
        language: system
        pass_filenames: false
        always_run: true
      - id: typecheck
        name: typecheck
        entry: uv run --frozen poe typecheck
        language: system
        pass_filenames: false
        always_run: true

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-added-large-files
