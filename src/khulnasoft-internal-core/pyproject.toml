[build-system]
requires = ["hatchling>=1.27.0,<2"]
build-backend = "hatchling.build"

[project]
name = "khulnasoft-internal-core"
dynamic = ["version", "dependencies"]
description = "Shared internal runtime for Khulnasoft Python packages"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE", "LICENSE.*"]

[tool.hatch.metadata.hooks.custom]
path = "_khulnasoft_hatch_build.py"

[tool.khulnasoft.release.dependencies]
dependencies = [
    "httpx2>=2",
    "anyio>=4.0.0,<5",
    "typing-extensions>=4.6.0,<5 ; python_version < '3.12'",
]

[tool.hatch.version]
path = "khulnasoft/_internal/core/version.py"

[tool.hatch.build.targets.sdist]
force-include = { "../../scripts/hatch_build.py" = "/_khulnasoft_hatch_build.py" }
include = [
    "/khulnasoft/api/**",
    "/khulnasoft/errors/**",
    "/khulnasoft/_internal/core/**",
    "/README.md",
    "/pyproject.toml",
    "/_khulnasoft_hatch_build.py",
    "/LICENSE",
]
exclude = [
    "/**/__pycache__",
]

[tool.hatch.build.targets.wheel]
dev-mode-dirs = ["."]
only-include = [
    "/khulnasoft/api",
    "/khulnasoft/errors",
    "/khulnasoft/_internal/core",
]
exclude = [
    "/**/__pycache__",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "../.."]
addopts = "--no-header --capture=tee-sys"
asyncio_mode = "auto"

[tool.poe]
include = "../../scripts/poe/poe.toml"
verbosity = -1

[tool.mypy]
cache_dir = "../../.mypy_cache/khulnasoft-internal-core"
explicit_package_bases = true
packages = ["khulnasoft._internal.core"]

[tool.poe.tasks.typecheck]
cmd = "$MYPY"
