[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "khulnasoft"
version = "0.3.0"
description = "Python SDK for KhulnaSoft"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE", "LICENSE.*"]
dependencies = [
    "httpx>=0.27.0",
    "pydantic>=2.7.0",
    "anyio>=4.15.1",
    "python-dotenv",
    "websockets>=16.1.1",
]

[project.scripts]
khulnasoft = "khulnasoft.__main__:main"
khulnasoft-sandbox = "khulnasoft.sandbox.__main__:main"
sandbox = "khulnasoft.sandbox.__main__:main"

[dependency-groups]
dev = [
    "ruff>=0.5.0",
    "pytest>=7.0.0",
    "pytest-asyncio",
    "pytest-xdist",
    "mypy",
    "build",
    "twine",
    "pytest-cov>=7.1.0",
    "pre-commit>=4.6.2",
]

[tool.uv]
default-groups = ["dev"]
package = true

[tool.setuptools.packages.find]
where = ["src"]
include = ["khulnasoft*"]
namespaces = true

[tool.setuptools]
include-package-data = false

[tool.setuptools.package-data]
khulnasoft = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
asyncio_mode = "auto"

[tool.mypy]
ignore_missing_imports = true

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "C4", # flake8-comprehensions
    "UP", # pyupgrade
]
isort = { combine-as-imports = true, known-first-party = ["khulnasoft"] }

[tool.ruff.lint.pyupgrade]
keep-runtime-typing = false

[tool.ruff.lint.per-file-ignores]
"examples/**/*.py" = ["E501"]
