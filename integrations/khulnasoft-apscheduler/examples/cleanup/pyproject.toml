[project]
name = "khulnasoft-apscheduler-example-cleanup"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "APScheduler>=3.10.4,<4",
    "khulnasoft-apscheduler>=0.1.0",
    "fastapi>=0.115.6,<0.116",
]

[tool.uv]
package = false

[[tool.khulnasoft.subscribers]]
entrypoint = "scheduler:scheduler"

[tool.uv.sources]
khulnasoft-apscheduler = { git = "https://github.com/khulnasoft/khulnasoft-py.git", branch = "main", subdirectory = "integrations/khulnasoft-apscheduler" }
